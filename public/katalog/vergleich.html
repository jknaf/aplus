<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Katalog Vergleich</title>
<!-- Prüfseite vor dem Livegang wieder entfernen. Vorschaubild, 3D-Modell im Startwinkel, Differenz. -->
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.1.0/dist/model-viewer.min.js"></script>
<style>
  body { font: 14px system-ui, sans-serif; margin: 16px; background: #fff; color: #222; }
  #stand { font-weight: 600; margin-bottom: 12px; }
  .zeile { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .zeile img { width: 200px; height: 200px; border: 1px solid #ddd; background: #fff; }
  .zeile .t { width: 220px; }
  .schlecht { color: #b00; font-weight: 700; }
  #buehne { position: fixed; right: 0; top: 0; width: 640px; height: 640px; background: #fff; }  /* muss sichtbar sein, sonst rendert model-viewer nicht */
  #buehne model-viewer { width: 640px; height: 640px; background: transparent; }
</style>
</head>
<body>
<div id="stand">Lade …</div>
<div id="liste"></div>
<div id="buehne"></div>
<script type="module">
const N = 640, rad = Math.PI / 180;
const weiss = (src) => new Promise((ok, fehler) => {
  const i = new Image(); i.crossOrigin = 'anonymous';
  i.onload = () => { const c = document.createElement('canvas'); c.width = c.height = N; const g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, N, N); g.drawImage(i, 0, 0, N, N); ok(c); };
  i.onerror = fehler; i.src = src;
});
// gleiche Attribute und gleiche Bildwinkel-Korrektur wie components/katalog/ModellAnsicht.tsx
function modell(e) {
  return new Promise((ok) => {
    const mv = document.createElement('model-viewer');
    const k = e.kamera ?? { ziel: [0, 0, 0], abstand: 5 };
    Object.entries({ src: e.modell, 'tone-mapping': 'none', 'shadow-intensity': '0', 'interaction-prompt': 'none',
      'camera-target': e.kamera ? k.ziel.map((v) => `${v}m`).join(' ') : 'auto auto auto',
      'camera-orbit': `38.7deg 68.8deg ${e.kamera ? `${k.abstand}m` : 'auto'}`,
      'field-of-view': '39.6deg', 'max-field-of-view': '70deg', 'max-camera-orbit': 'auto auto 100m', 'min-camera-orbit': 'auto auto 0.3m', loading: 'eager' })
      .forEach(([a, w]) => mv.setAttribute(a, w));
    const t0 = performance.now();
    mv.addEventListener('load', async () => {
      const ms = performance.now() - t0;
      const { width, height } = mv.getBoundingClientRect();
      const soll = 2 * Math.atan(Math.tan(19.8 * rad) / Math.min(1, width / height));
      const f = Math.tan((mv.getFieldOfView() * rad) / 2) / Math.tan(19.8 * rad);
      mv.fieldOfView = `${2 * Math.atan(Math.tan(soll / 2) / f)}rad`;
      mv.jumpCameraToGoal();
      await new Promise((r) => setTimeout(r, 400));
      const url = mv.toDataURL('image/png'); mv.remove(); ok({ url, ms });
    }, { once: true });
    mv.addEventListener('error', () => { mv.remove(); ok(null); }, { once: true });
    document.getElementById('buehne').append(mv);
  });
}
function differenz(a, b) {
  const pa = a.getContext('2d').getImageData(0, 0, N, N).data, pb = b.getContext('2d').getImageData(0, 0, N, N).data;
  const c = document.createElement('canvas'); c.width = c.height = N; const g = c.getContext('2d'); const d = g.createImageData(N, N);
  let summe = 0, stark = 0, objekt = 0;
  for (let i = 0; i < pa.length; i += 4) {
    const dd = (Math.abs(pa[i] - pb[i]) + Math.abs(pa[i + 1] - pb[i + 1]) + Math.abs(pa[i + 2] - pb[i + 2])) / 3;
    if (pa[i] + pa[i + 1] + pa[i + 2] < 750 || pb[i] + pb[i + 1] + pb[i + 2] < 750) { objekt++; summe += dd; if (dd > 40) stark++; }
    const v = 255 - Math.min(255, dd * 3); d.data[i] = 255; d.data[i + 1] = v; d.data[i + 2] = v; d.data[i + 3] = 255;
  }
  g.putImageData(d, 0, 0);
  return { url: c.toDataURL('image/png'), mittel: summe / Math.max(1, objekt), anteil: (100 * stark) / Math.max(1, objekt) };
}
const katalog = await (await fetch('/katalog/katalog.json')).json();
await customElements.whenDefined('model-viewer');
const ergebnisse = []; window.ergebnisse = ergebnisse;
const nur = new URLSearchParams(location.search).get('nur')?.split(',');
if (nur) katalog.elemente = katalog.elemente.filter((e) => nur.includes(e.slug));
for (const [n, e] of katalog.elemente.entries()) {
  document.getElementById('stand').textContent = `Prüfe ${n + 1} von ${katalog.elemente.length}: ${e.slug}`;
  const m = await modell(e);
  const zeile = document.createElement('div'); zeile.className = 'zeile';
  if (!m) { zeile.innerHTML = `<div class="t schlecht">${e.slug}: Modell lädt nicht</div>`; ergebnisse.push({ slug: e.slug, fehler: true }); document.getElementById('liste').append(zeile); continue; }
  const [p, mm] = await Promise.all([weiss(e.bild), weiss(m.url)]);
  const d = differenz(p, mm);
  const r = { slug: e.slug, mittel: +d.mittel.toFixed(1), anteil: +d.anteil.toFixed(1), ms: Math.round(m.ms) };
  ergebnisse.push(r);
  const schlecht = r.anteil > 5;
  zeile.dataset.slug = e.slug;
  zeile.innerHTML = `<div class="t ${schlecht ? 'schlecht' : ''}">${e.slug}<br>Abweichung ${r.mittel} (stark: ${r.anteil} %)<br>Ladezeit ${r.ms} ms</div>
    <img src="${p.toDataURL()}" title="Vorschaubild"><img src="${mm.toDataURL()}" title="3D-Modell"><img src="${d.url}" title="Differenz">`;
  document.getElementById('liste').append(zeile);
}
const auff = ergebnisse.filter((r) => r.fehler || r.anteil > 5);
document.getElementById('stand').textContent = `Fertig: ${ergebnisse.length} Elemente, auffällig: ${auff.length}` + (auff.length ? ` (${auff.map((r) => r.slug).join(', ')})` : '');
window.fertig = true;
</script>
</body>
</html>
